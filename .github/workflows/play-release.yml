# Play용 AAB를 CI에서 빌드해 Google Play 트랙에 올립니다(README "릴리스").
#
# - 태그 v<x.y.z>가 올라오면 그 버전을 비공개 테스트(alpha) 트랙에 올립니다.
#   같은 태그로 deploy.yml이 GitHub 릴리스(APK/AAB)를 따로 만듭니다 — 이 워크플로는 Play 업로드만 합니다.
# - Actions 화면에서 손으로 돌릴 수도 있습니다(version 입력).
#   · dry_run: 빌드·서명 확인·트랙 조회까지만 하고 올리지 않습니다.
#   · production: 켜면 alpha에 올린 같은 versionCode를 프로덕션에도 붙입니다(기본 꺼짐, 태그 실행에서는 항상 꺼짐).
# Play 서비스 계정 키는 GitHub 환경 'play'에만 있고, 그 환경은 jeiel85의 승인을 받아야 실행됩니다(main 브랜치·v* 태그만).
# 업로드 키스토어는 deploy.yml과 같은 저장소 Secrets(RELEASE_*)를 씁니다 — 이 앱은 GitHub APK와 Play가 같은 업로드 키입니다(SIGNING_HANDOFF.md).
name: Play release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (x.y.z, package.json·build.gradle versionName과 같고 CHANGELOG에 항목이 있어야 함)'
        required: true
      dry_run:
        description: '올리지 않고 빌드·서명 확인·트랙 조회만'
        type: boolean
        default: false
      production:
        description: 'alpha에 이어 프로덕션에도 올리기(전체 출시)'
        type: boolean
        default: false

concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-latest
    environment: play
    timeout-minutes: 45
    env:
      PACKAGE: com.jeiel85.luminadaily
      # Play 업로드 키(lumina-upload) 인증서 SHA-256(SIGNING_HANDOFF.md). 다른 키로 서명된 번들은 올리기 전에 멈춥니다.
      UPLOAD_CERT_SHA256: '94:69:60:11:A3:72:2A:1D:12:A7:5F:2E:C9:FA:C7:AD:94:F5:53:26:3D:18:81:71:B6:98:6E:0E:57:E8:40:C4'
    steps:
      - uses: actions/checkout@v4

      - name: 버전 정하기
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY: ${{ inputs.dry_run }}
          PROD: ${{ inputs.production }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then VER="${GITHUB_REF_NAME#v}"; PROD=false; else VER="$INPUT_VERSION"; fi
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::버전은 x.y.z여야 합니다: $VER"; exit 1; }
          PKG=$(node -p "require('./package.json').version")
          [ "$PKG" = "$VER" ] || { echo "::error::package.json 버전($PKG)이 $VER과 다릅니다"; exit 1; }
          NAME=$(sed -nE 's/^\s*versionName\s+"([^"]+)".*/\1/p' android/app/build.gradle)
          CODE=$(sed -nE 's/^\s*versionCode\s+([0-9]+).*/\1/p' android/app/build.gradle)
          [ "$NAME" = "$VER" ] || { echo "::error::build.gradle versionName($NAME)이 $VER과 다릅니다"; exit 1; }
          [[ "$CODE" =~ ^[0-9]+$ ]] || { echo "::error::build.gradle에서 versionCode를 읽지 못했습니다"; exit 1; }
          grep -q "^## v$VER\b" CHANGELOG.md || { echo "::error::CHANGELOG.md에 '## v$VER' 항목이 없습니다"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "dry=${DRY:-false}" >> "$GITHUB_OUTPUT"
          echo "prod=${PROD:-false}" >> "$GITHUB_OUTPUT"
          echo "v$VER (versionCode $CODE), dry_run=${DRY:-false}, production=${PROD:-false}"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 시험(타입 검사·단위 시험)
        run: |
          npm run lint
          npx vitest run

      - name: 웹 자산 빌드
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Capacitor 동기화
        run: npx cap sync android

      - name: 서명 키 놓기
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          [ -s android/app/release.keystore ]

      - name: AAB 빌드
        working-directory: android
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease
          AAB="$PWD/app/build/outputs/bundle/release/app-release.aab"
          [ -s "$AAB" ]
          echo "AAB=$AAB" >> "$GITHUB_ENV"

      - name: 출시 노트(CHANGELOG에서, 검증·설정 절 제외, 500자까지)
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p play-out
          awk -v a="## v$VER" '
            ($0 == a || index($0, a " ")==1) {on=1; skip=0; next}
            /^## / {on=0}
            on && /^### / {skip = ($0 ~ /검증|설정/); next}
            on && !skip && /^- / {print "• " substr($0, 3)}
          ' CHANGELOG.md | sed -E 's/\*\*([^*]+)\*\*/\1/g; s/`([^`]+)`/\1/g' > play-out/notes-full.txt
          python3 - <<'PY'
          s = open("play-out/notes-full.txt", encoding="utf-8").read().strip()
          if len(s) > 500:
              s = s[:499].rsplit("\n", 1)[0] if "\n" in s[:499] else s[:499]
              s = s.rstrip() + "…"
          open("play-out/notes-ko.txt", "w", encoding="utf-8").write(s)
          print(f"{len(s)}자")
          PY
          cat play-out/notes-ko.txt

      - uses: actions/upload-artifact@v4
        with:
          name: lumina-daily-play-${{ steps.ver.outputs.version }}
          path: |
            ${{ env.AAB }}
            play-out/notes-ko.txt
          retention-days: 30

      - name: Play 트랙 상태(올리기 전)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -o pipefail
          pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -ShowTracks | tee play-out/tracks-before.txt

      - name: 업로드 키 서명 확인(AAB)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -Track alpha -AabPath "$AAB" \
            -ExpectedUploadCertSha256 "$UPLOAD_CERT_SHA256" -DryRun

      - name: Play에 올리기(alpha, 고르면 프로덕션)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VER: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
          DRY: ${{ steps.ver.outputs.dry }}
          PROD: ${{ steps.ver.outputs.prod }}
        run: |
          DRYFLAG=(); [ "$DRY" = true ] && DRYFLAG=(-DryRun)
          # 이미 어느 트랙에든 붙은 versionCode는 다시 올리지 않습니다(Play가 같은 versionCode 재업로드를 거부).
          # 태그 실행으로 alpha에 올린 버전을 나중에 production=true로 승격할 때가 이 경우입니다.
          if grep -Eq "\[versionCode ([0-9]+,)*$CODE(,[0-9]+)*\]" play-out/tracks-before.txt; then
            echo "versionCode $CODE 는 이미 Play 트랙에 있습니다 — alpha 업로드를 건너뜁니다."
          else
            pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -Track alpha -AabPath "$AAB" \
              -ExpectedUploadCertSha256 "$UPLOAD_CERT_SHA256" -ExpectedVersionCode "$CODE" -VersionName "$VER" \
              -NotesKoFile play-out/notes-ko.txt "${DRYFLAG[@]}"
          fi
          if [ "$PROD" = true ]; then
            pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -Track production -ExpectedVersionCode "$CODE" \
              -VersionName "$VER" -NotesKoFile play-out/notes-ko.txt "${DRYFLAG[@]}"
          fi

      - name: Play 트랙 상태(올린 뒤)
        if: steps.ver.outputs.dry != 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -ShowTracks

      - name: 키 지우기
        if: always()
        run: rm -f android/app/release.keystore
